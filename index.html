<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>abhijit@portfolio:~</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/terminal.css" />
  <link rel="stylesheet" href="css/crt.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Boot sequence overlay -->
  <div id="boot-screen">
    <pre id="boot-text"></pre>
  </div>

  <!-- CRT scanline / vignette overlay -->
  <div class="crt-overlay"></div>
  <div class="crt-flicker"></div>

  <div id="terminal" class="hidden">

    <!-- Fake window chrome -->
    <header class="title-bar">
      <div class="title-bar-buttons">
        <span class="btn btn-close"></span>
        <span class="btn btn-min"></span>
        <span class="btn btn-max"></span>
      </div>
      <div class="title-bar-text">abhijit@portfolio: ~</div>
      <div class="title-bar-clock" id="clock">00:00:00</div>
    </header>

    <!-- Output history -->
    <main id="output" aria-live="polite"></main>

    <!-- Input line -->
    <div class="input-line">
      <span class="prompt">
        <span class="prompt-user">abhijit</span><span class="prompt-at">@</span><span class="prompt-host">portfolio</span><span class="prompt-colon">:</span><span class="prompt-path">~</span><span class="prompt-dollar">$</span>
      </span>
      <span class="input-wrap">
        <span id="input-mirror" class="input-mirror"></span>
        <input type="text" id="cmd-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command input" />
        <span class="cursor-block" id="cursor-block"></span>
      </span>
    </div>
  </div>

  <!-- Hidden helper for screen readers describing how to use the site -->
  <p class="sr-only">This is an interactive terminal portfolio. Type "help" and press Enter to see available commands.</p>

  <script src="js/data.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
